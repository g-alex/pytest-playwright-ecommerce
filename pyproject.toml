[project]
name = "pytest-playwright-ecommerce"
version = "1.0.0"
description = "Black-box API and UI tests for a Telegram Mini App e-commerce product"
requires-python = ">=3.10"
dependencies = [
    "pytest>=8.0",
    "pytest-playwright>=0.5",
    "playwright>=1.40",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "jsonschema>=4.20",
    "allure-pytest>=2.13",
    "pytest-html>=4.1",
    "pytest-rerunfailures>=14.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "api: API layer tests",
    "ui: Playwright UI tests",
    "smoke: critical smoke suite",
    "negative: negative / validation cases",
]
addopts = "-ra --strict-markers --screenshot only-on-failure --tracing retain-on-failure"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"
